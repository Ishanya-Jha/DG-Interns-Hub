<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Simple Calculator</h1>

        <input
            type="text"
            id="display"
            placeholder="0"
            readonly
        >

        <div id="calculator-buttons">
           <!--  Calculator button layout:
                   789 /  → First row
                   456 *  → Second row
                   123 -  → Third row
                  0 . = + → Fourth row
                  Clear   → Clear button
          Alt + 26 = →  -->
        <!--1st Row-->
        <div>
            <button type="button" class="number" >7</button>
            <button type="button" class="number" >8</button>
            <button type="button" class="number" >9</button>
            <button type="button" id="divide">/</button>
        </div>
         <!--2nd Row-->
        <div>  
            <button type="button" class="number" >4</button>
            <button type="button" class="number" >5</button>
            <button type="button" class="number" >6</button>
            <button type="button" id="multiply">*</button>
        </div>
         <!--3rd Row-->
         <div>
            <button type="button" class="number" >1</button>
            <button type="button" class="number" >2</button>
            <button type="button" class="number" >3</button>
            <button type="button" id="subtract">-</button>
        </div>
         <!--4th Row-->
        <div>
            <button type="button" class="number" >0</button>
            <button type="button" id="decimal">.</button>
            <button type="button" id="equals">=</button>
            <button type="button" id="plus">+</button>
        </div>
         <!--Clear Button-->
        <div>
            <button type="button" id="clear">Clear</button>
        </div>
        </div>

    </main>

    <!-- JavaScript will be connected here.
         HTML creates the calculator structure.
         JavaScript will make the buttons functional. -->

    <script src="script.js"></script>

</body>

</html>
